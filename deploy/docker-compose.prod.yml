# Production: PostgreSQL + API + web + Caddy (HTTPS) + nightly backups, on one server.
# Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# First time only, after "up": see deploy/DEPLOY.md step 5 (setup service).
name: gymcrm

x-api-env: &api-env
  NODE_ENV: production
  TZ: Asia/Kolkata
  DATABASE_URL: postgresql://gym_app:${APP_DB_PASSWORD}@db:5432/gymcrm
  SESSION_SECRET: ${SESSION_SECRET}
  WEB_ORIGIN: https://${DOMAIN}
  PUBLIC_APP_URL: https://${DOMAIN}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD}
      POSTGRES_DB: gymcrm
      TZ: Asia/Kolkata
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_owner -d gymcrm"]
      interval: 10s
      retries: 10
    # No ports: the database is reachable only from the other containers.

  # One-off: database migrations + first-run setup. Runs, prints, exits.
  setup:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: gymcrm-api
    profiles: ["setup"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      MIGRATE_DATABASE_URL: postgresql://gym_owner:${OWNER_DB_PASSWORD}@db:5432/gymcrm
      DATABASE_URL: postgresql://gym_owner:${OWNER_DB_PASSWORD}@db:5432/gymcrm
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      GYM_NAME: ${GYM_NAME:-}
      GYM_LEGAL_NAME: ${GYM_LEGAL_NAME:-}
      GYM_GSTIN: ${GYM_GSTIN:-}
      GYM_STATE_CODE: ${GYM_STATE_CODE:-33}
      GYM_STATE: ${GYM_STATE:-Tamil Nadu}
      BRANCH_CODE: ${BRANCH_CODE:-}
      BRANCH_NAME: ${BRANCH_NAME:-}
      BRANCH_ADDRESS: ${BRANCH_ADDRESS:-}
      BRANCH_CITY: ${BRANCH_CITY:-}
      BRANCH_PINCODE: ${BRANCH_PINCODE:-}
      BRANCH_PHONE: ${BRANCH_PHONE:-}
      OWNER_NAME: ${OWNER_NAME:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PHONE: ${OWNER_PHONE:-}
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/setup-production.ts"]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: gymcrm-api
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: *api-env

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    image: gymcrm-web
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api, web]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: gym_owner
      PGPASSWORD: ${OWNER_DB_PASSWORD}
      PGDATABASE: gymcrm
      TZ: Asia/Kolkata
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["bash", "/backup.sh"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
